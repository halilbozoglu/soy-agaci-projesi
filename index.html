<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soy Ağacı Projesi</title>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex overflow-hidden">
    <!-- Sol Menü: Formlar ve Yönetim -->
    <aside class="w-80 bg-white shadow-2xl flex flex-col h-full overflow-y-auto z-10 p-5 border-r border-slate-200">
        <h1 class="text-xl font-bold mb-5 text-slate-800 border-b pb-3">Aile Ağacı</h1>
        
        <div class="space-y-5">
            <!-- Global action butonları -->
            <div class="flex space-x-2">
                <button id="btn-undo" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded text-sm font-semibold transition-colors">Geri Al</button>
                <button id="btn-clear" class="flex-1 bg-red-100 hover:bg-red-200 text-red-700 py-2 rounded text-sm font-semibold transition-colors">Sıfırla</button>
            </div>

            <!-- Kişi Ekleme Formu -->
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 shadow-inner">
                <h2 class="text-md font-bold text-slate-700 mb-3">Yeni Kişi Ekle</h2>
                <form id="form-person" class="space-y-3">
                    <input type="text" id="p-ad" placeholder="Ad" required class="w-full px-3 py-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                    <input type="text" id="p-soyad" placeholder="Soyad" required class="w-full px-3 py-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                    <select id="p-cinsiyet" class="w-full px-3 py-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none text-slate-600">
                        <option value="Erkek">Erkek</option>
                        <option value="Kadın">Kadın</option>
                        <option value="Belirtilmemiş">Belirtilmemiş</option>
                    </select>
                    <input type="text" id="p-tarih" placeholder="Doğum Tarihi (1990 vb.)" class="w-full px-3 py-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                    <input type="text" id="p-yakinlik" placeholder="Yakınlık (Serbest Metin)" class="w-full px-3 py-2 text-sm border rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                    
                    <!-- Drag & Drop Fotoğraf -->
                    <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded p-3 text-center text-xs text-slate-500 bg-white hover:bg-slate-100 transition-colors cursor-pointer">
                        Fotoğraf Buraya Sürükle veya Seç
                        <input type="file" id="p-foto" class="hidden" accept="image/*" />
                    </div>
                    
                    <div id="preview-container" class="hidden justify-center my-1">
                        <img id="img-preview" src="" alt="Önizleme" class="w-16 h-16 rounded-full object-cover border-2 border-slate-300" />
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded text-sm transition-all shadow-sm">Kişiyi Oluştur</button>
                </form>
            </div>

            <!-- Birliktelik (Makro) Formu -->
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 shadow-inner">
                <h2 class="text-md font-bold text-slate-700 mb-2">Birliktelik Kur</h2>
                <p class="text-[10px] text-slate-500 mb-3 font-medium">Listede yoksa bile otomatik kişi oluşturulup bağlanır.</p>
                <form id="form-union" class="space-y-3">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Ebeveyn / Partner 1</label>
                        <input type="text" id="u-partner1" list="person-list" placeholder="İsim Girin..." required class="w-full px-3 py-2 text-sm border rounded focus:ring-2 focus:ring-pink-500 outline-none" />
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Ebeveyn / Partner 2</label>
                        <input type="text" id="u-partner2" list="person-list" placeholder="İsim Girin..." class="w-full px-3 py-2 text-sm border rounded focus:ring-2 focus:ring-pink-500 outline-none" />
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Çocuklar (Virgülle Ayırın)</label>
                        <input type="text" id="u-children" placeholder="Çocuk 1, Çocuk 2..." class="w-full px-3 py-2 text-sm border rounded focus:ring-2 focus:ring-pink-500 outline-none" />
                    </div>

                    <datalist id="person-list"></datalist>

                    <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-semibold py-2 rounded text-sm transition-all shadow-sm">Bağlantıyı Kur</button>
                </form>
            </div>
        </div>
    </aside>

    <!-- Grafik Render Alanı -->
    <main class="flex-1 h-full relative" id="graph-container">
        <!-- D3-DAG SVG burada render edilecek -->
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
